seed: 20260828

market:
  primary_category: spot
  primary_symbol: BTCUSDC
  book_depth: 50

replay:
  tick_ms: 250
  fast_window_ms: 1000
  slow_window_ms: 5000
  reorder_ms: 250
  top_levels_imbalance: 10

sampler:
  snapshot_on_speedup: true
  max_heat: 8.0
  # Seed only; optimizer replaces these thresholds for each profile.
  interval_map:
    - {name: EXTREME, min_heat: 2.80, interval_ms: 800}
    - {name: ACTIVE,  min_heat: 1.55, interval_ms: 1500}
    - {name: NORMAL,  min_heat: 0.70, interval_ms: 2500}
    - {name: QUIET,   min_heat: 0.00, interval_ms: 5000}
  heat:
    # v0.4 separates ATTACK from SUSTAIN/RELEASE.
    tau_ms: 1400
    quiet_tau_multiplier: 0.42
    gain: 0.80
    function: sqrt_excess
    # Small single-sensor deviations should not keep the recorder fast.
    single_sensor_multiplier: 0.12
    confluence_bonus: 0.22
    dead_zone:
      price: 1.15
      flow: 1.35
      book: 1.35
    # A current Tier-A-like price shock forces 800 ms immediately.
    # A current flow+book confluence forces <=1500 ms immediately.
    shock_event_fraction:
      price: 0.90
      flow: 0.90
      book: 0.90
    weights:
      price_range: 0.34
      tick_travel: 0.20
      trade_rate: 0.11
      quote_volume: 0.07
      book_churn: 0.16
      imbalance_delta: 0.12

calibration:
  baseline_quantile: 0.50
  positive_only_for_flow: true
  event_quantile: 0.995
  floors:
    price_range_bp: 0.75
    tick_travel_bp: 1.00
    trade_rate_s: 40.0
    quote_volume_s: 50000.0
    book_churn_s: 250.0
    imbalance_delta: 0.12

evaluation:
  episode_gap_ms: 1500
  event_context_ms: 1000
  tier_a_required_interval_ms: 800
  tier_b_required_interval_ms: 1500
  tier_c_required_interval_ms: 2500
  snapshot_grace_ms: 750
  oversampling_slow_interval_ms: 2500
  oversampling_stable_ms: 1000
  oversampling_horizon_ms: 30000
  tier_weights:
    A: 2.0
    B: 1.0

acceptance:
  # Quality first.
  tier_a_recall_min: 0.98
  tier_b_recall_min: 0.90
  ab_weighted_recall_min: 0.95
  tier_a_snapshot_recall_min: 0.98
  tier_b_snapshot_recall_min: 0.90
  reaction_p95_ms_max: 750
  oversampling_p95_ms_max: 6000
  false_fast_time_max: 0.20
  # We are NOT trying to maximize compression. A meaningful 40% reduction is enough.
  snapshot_reduction_min: 0.40
  # Used only for ranking candidates that already pass every quality gate.
  preferred_snapshot_reduction: 0.50

search:
  # 5 x 4 x 2 x 3 x 4 = exactly 480 variants.
  # Shorter tau values are intentional: attack is handled separately by shock channels.
  tau_ms: [700, 1000, 1400, 1900, 2600]
  gain: [0.55, 0.75, 0.95, 1.20]
  transforms: [log_excess, sqrt_excess]
  weight_families:
    balanced:
      price_range: 0.30
      tick_travel: 0.17
      trade_rate: 0.13
      quote_volume: 0.09
      book_churn: 0.18
      imbalance_delta: 0.13
    price_heavy:
      price_range: 0.38
      tick_travel: 0.22
      trade_rate: 0.10
      quote_volume: 0.06
      book_churn: 0.14
      imbalance_delta: 0.10
    confluence:
      price_range: 0.28
      tick_travel: 0.16
      trade_rate: 0.13
      quote_volume: 0.09
      book_churn: 0.20
      imbalance_delta: 0.14
  # Profiles also control the dead-zone and release behavior. They are not just storage thresholds.
  response_profiles:
    responsive:
      thresholds: [0.55, 1.30, 2.55]
      dead_zone: {price: 1.10, flow: 1.25, book: 1.25}
      quiet_tau_multiplier: 0.50
      single_sensor_multiplier: 0.16
      shock_event_fraction: {price: 0.85, flow: 0.85, book: 0.85}
    balanced:
      thresholds: [0.70, 1.55, 2.80]
      dead_zone: {price: 1.15, flow: 1.35, book: 1.35}
      quiet_tau_multiplier: 0.42
      single_sensor_multiplier: 0.12
      shock_event_fraction: {price: 0.90, flow: 0.90, book: 0.90}
    clean_release:
      thresholds: [0.80, 1.75, 3.05]
      dead_zone: {price: 1.20, flow: 1.45, book: 1.45}
      quiet_tau_multiplier: 0.34
      single_sensor_multiplier: 0.08
      shock_event_fraction: {price: 0.90, flow: 0.90, book: 0.90}
    fidelity:
      thresholds: [0.60, 1.40, 2.65]
      dead_zone: {price: 1.10, flow: 1.20, book: 1.20}
      quiet_tau_multiplier: 0.46
      single_sensor_multiplier: 0.14
      shock_event_fraction: {price: 0.80, flow: 0.80, book: 0.80}
